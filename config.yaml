# Daily News Digest v2 — Configuration

llm:
  # Provider chain with role-based dispatch.
  # role: list of roles this provider handles.
  # Valid roles: summarize | extract_narratives | generate_queries | rank_signals | fallback
  # Supported providers: anthropic | gemini | groq | mistral | deepseek
  providers:
    - name: gemini
      model: gemini-2.5-flash
      role: [summarize, generate_queries, rank_signals]
    - name: groq
      model: llama-3.3-70b-versatile
      role: [summarize, extract_narratives]
    - name: deepseek
      model: deepseek-chat
      role: [fallback]

  # Per-category model routing (optional).
  # Categories not listed here use the default role-based dispatch above.
  routing:
    - categories: ["AI & LLM", "AI Engineering"]
      provider: gemini
      model: gemini-2.5-flash
    - categories: ["Banking & Fintech"]
      provider: groq
      model: llama-3.3-70b-versatile
    - categories: ["Architecture & Distributed Systems"]
      provider: deepseek
      model: deepseek-chat

radar:
  # Language for digest content: "ru" (Russian) | "en" (English)
  language: ru
  # Maximum number of articles fetched per category
  max_articles_per_category: 8
  # Summary style: "analytical" | "brief" | "detailed"
  summary_style: analytical
  # Enable three perspectives (Optimist/Skeptic/Realist) for top items
  perspectives: false

irritator:
  # Maximum number of dominant narratives to extract from radar output
  max_narratives: 5
  # Search queries to generate per narrative
  queries_per_narrative: 3
  # Top counter-signals to surface per narrative
  top_signals: 3
  # Minimum signal relevance score (1-10) to include in output
  min_signal_score: 5
  # Sources to search for counter-signals
  sources: [hackernews, reddit, arxiv, devto, lobsters]
  # Subreddits to search when reddit is in sources
  reddit_subreddits:
    - programming
    - ExperiencedDevs
    - softwarearchitecture
    - banking
    - fintech

filters:
  # Articles containing any of these keywords (case-insensitive) are excluded
  blocklist_keywords:
    - election
    - trump
    - biden
    - celebrity
    - sports

telegram:
  # Send digest via Telegram bot (requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID)
  enabled: true
  # Send radar and counter-signals as separate messages
  split_messages: true
  # Maximum total Telegram messages per digest run (article cards + radar + signals)
  max_messages: 10

obsidian:
  # Commit generated markdown file back to the repo (Obsidian git-sync)
  enabled: true
  output_dir: digests

adaptive:
  # Enable adaptive source management (dynamic priority recalculation,
  # feedback collection, trial source lifecycle)
  enabled: true
  # Weight of user feedback (Telegram 👍/👎) in priority calculation (0.0–1.0)
  feedback_weight: 0.3
  # Weight of objective quality score in priority calculation (0.0–1.0)
  score_weight: 0.5
  # Weight of base (static) priority from config in priority calculation (0.0–1.0)
  base_weight: 0.2
  # Number of article slots reserved for trial sources (separate from main budget)
  trial_slots: 4
  # Effective priority range after recalculation
  min_priority: 1
  max_priority: 5

sources:
  # ============================================================
  # Source management
