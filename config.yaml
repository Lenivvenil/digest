# Daily News Digest — Configuration
# Edit this file to customize your digest

llm:
  # Provider chain: first entry is primary, rest are fallbacks.
  # Supported providers: anthropic | gemini | groq | mistral | deepseek
  # If a provider's API key is missing it is skipped (only the primary is required).
  providers:
    - name: "gemini"
      model: "gemini-2.5-flash"
    - name: "groq"
      model: "llama-3.3-70b-versatile"

  # Per-category model routing (optional).
  # Categories not listed here use the default providers chain above.
  # If a routed provider's API key is missing, falls back to default chain.
  routing:
    - categories: ["AI & LLM", "AI Engineering"]
      provider: "gemini"
      model: "gemini-2.5-flash"
    - categories: ["Banking & Fintech", "Payments & Fintech"]
      provider: "groq"
      model: "llama-3.3-70b-versatile"
    - categories: ["Architecture & Distributed Systems"]
      provider: "deepseek"
      model: "deepseek-chat"

delivery:
  # Send digest via Telegram bot (requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID)
  telegram: true
  # Commit generated markdown file back to the repo (useful with Obsidian git-sync)
  markdown_to_repo: true
  # Directory where markdown digest files are saved
  markdown_dir: "digests"

adaptive:
  # Enable adaptive source management (dynamic priority recalculation,
  # feedback collection, trial source lifecycle)
  enabled: true
  # Weight of user feedback (Telegram 👍/👎) in priority calculation (0.0–1.0)
  feedback_weight: 0.3
  # Weight of objective quality score in priority calculation (0.0–1.0)
  score_weight: 0.5
  # Weight of base (static) priority from config in priority calculation (0.0–1.0)
  base_weight: 0.2
  # Number of article slots reserved for trial sources (separate from main budget)
  trial_slots: 4
  # Effective priority range after recalculation
  min_priority: 1
  max_priority: 5

digest:
  # Language for digest content: "ru" (Russian) | "en" (English)
  language: "ru"
  # Maximum number of articles fetched per RSS source
  max_articles_per_source: 5
  # Maximum total articles across all sources
  max_total_articles: 30
  # Summary style:
  #   "analytical" — with trend analysis and three perspectives for top topics (default)
  #   "brief"      — one sentence per news item, no perspectives
  #   "detailed"   — full context, three perspectives for all items
  summary_style: "analytical"

sources:
  # ============================================================
  # Управление источниками
  # ============================================================
  # Каждый источник имеет следующие поля:
  #
  #   name     — отображаемое название (используется в дайджесте)
  #   url      — прямая ссылка на RSS/Atom-ленту
  #   category — тематика; статьи группируются по категориям в дайджесте.
  #              Можно использовать любое название — новые категории
  #              создаются автоматически.
  #   enabled  — true/false; false отключает источник без удаления
  #   priority — целое число от 1 до 5 (по умолчанию 3).
  #              Определяет долю слотов из max_total_articles, которую
  #              получает источник при сборке дайджеста.
  #              5 — максимальный приоритет (фундаментальные/инженерные блоги),
  #              1 — минимальный (широкие новостные фиды).
  #
  # Как добавить новый источник:
  #   1. Найдите RSS-ленту сайта (обычно /feed, /rss, /feed.xml, /atom.xml)
  #   2. Скопируйте любой блок ниже и заполните поля
  #   3. Укажите нужную category (существующую или новую)
  #
  # Как добавить новую тематику:
  #   Просто укажите новое название в поле category — оно появится
  #   в дайджесте автоматически. Примеры: "Cybersecurity", "Crypto",
  #   "RegTech", "Cloud & Infrastructure", "Central Asia"
  #
  # Как временно отключить источник:
  #   Установите enabled: false
  #
  # ============================================================

