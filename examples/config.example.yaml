# Safe configuration example: no enabled sources, external delivery or real credentials.
# Replace the model/feed placeholders and enable a source for an intentional live run.
llm:
  providers:
    - name: gemini
      model: YOUR_GEMINI_MODEL_ID
      role: [summarize, rank_signals, fallback]
  max_concurrent_requests: 1
  max_retries: 0

radar:
  language: en
  summary_style: analytical
  perspectives: true
  max_articles_per_category: 5

sources:
  - name: Example feed
    url: https://example.com/feed.xml
    category: Architecture
    enabled: false
    priority: 3
    recency_hours: 24

filters:
  blocklist_keywords: []

irritator:
  max_narratives: 3
  queries_per_narrative: 2
  top_signals: 3
  min_signal_score: 7
  sources: [hackernews, arxiv]

adaptive:
  enabled: false

review:
  enabled: false

telegram:
  # compact requires the managed reserve/persist/publish boundary; cards preserves legacy delivery.
  delivery_mode: compact
  # Plain username of the same bot as TELEGRAM_BOT_TOKEN; no @.
  # Enables vote link buttons; users must also tap Start. Omit for /vote commands only.
  bot_username: ""
  enabled: false
  required: false

obsidian:
  enabled: false
  output_dir: digests

# Optional presentation translation is off. It never translates sources or changes
# review/search prompts. See README before choosing an existing entitled model.
translation:
  enabled: false
  target_language: ru

# Full-source reading is opt-in; keep off until quality/cost acceptance.
# Enabling requires canonical English, review.enabled + review.review_led_only,
# and an existing explicitly configured route. No fallback or new credentials.
reading_brief:
  enabled: false
  provider: gemini
  model: YOUR_GEMINI_MODEL_ID
  max_output_tokens: 2048
  max_requests_per_run: 12
