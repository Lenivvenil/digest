name: Weekly Source Discovery

on:
  schedule:
    # 06:00 UTC = 11:00 Tashkent time (UTC+5), every Sunday
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Share the same concurrency group as digest.yml so that discover and digest
# cannot run simultaneously and corrupt the shared .cache/ files.
# cancel-in-progress: false ensures discover never cancels a running digest.
concurrency:
  group: digest
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run source discovery
        run: python -m src --discover > discover_output.txt 2>&1 || true

      - name: Show discovery output
        run: cat discover_output.txt

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not set — skipping notification."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          python3 - "$DATE" <<'PYEOF'
          import sys, os, json, urllib.request

          date = sys.argv[1]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          with open("discover_output.txt", encoding="utf-8") as f:
              output = f.read().strip() or "(no output)"

          # Truncate safely (keep under 3800 chars to leave room for header+backticks)
          if len(output) > 3800:
              output = output[:3800] + "\n… (truncated)"

          text = f"\U0001f50d Weekly source discovery \u2014 {date}\n```\n{output}\n```"

          body = json.dumps({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Telegram response: {resp.status}")
          PYEOF
