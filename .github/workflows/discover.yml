name: Weekly Source Discovery

on:
  schedule:
    # 06:00 UTC = 11:00 Tashkent time (UTC+5), every Sunday
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Share the same concurrency group as digest.yml so that discover and digest
# cannot run simultaneously and corrupt the shared .cache/ files.
# cancel-in-progress: false ensures discover never cancels a running digest.
concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/ --output-format=github

      - name: Type check
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v

  discover:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run source discovery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src --discover 2>&1 | tee discover_output.txt || true

      - name: Show discovery output
        run: cat discover_output.txt

      - name: Commit pending sources cache
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add .cache/
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new pending sources."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "discover: pending sources ${DATE}"
            git pull --rebase origin main
            git push origin HEAD
          fi
