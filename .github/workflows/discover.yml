name: Weekly Source Discovery

on:
  schedule:
    # 06:00 UTC every Sunday = 11:00 Tashkent time (UTC+5)
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Share concurrency group with digest to prevent simultaneous writes
concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run source discovery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src --discover --config config.yaml

      - name: Commit pending sources
        if: success() || failure()
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add .cache/ config.yaml
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new pending sources."
          else
            git commit -m "discover: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD
          fi
