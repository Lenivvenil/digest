name: Daily News Digest

on:
  schedule:
    # 02:00 UTC = 07:00 Tashkent time (UTC+5)
    - cron: '0 2 * * *'
    # 13:00 UTC = 18:00 Tashkent time (UTC+5)
    - cron: '0 13 * * *'
  workflow_dispatch:

# Prevent concurrent runs so that the dedup cache is never written by two
# simultaneous jobs, which would cause the same articles to be sent twice.
concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate config
        run: python -c "from src.config import load_config; load_config('config.yaml')"

  digest:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push back
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA_ARGS="--verbose"
          fi
          python -m src --config config.yaml $EXTRA_ARGS

      - name: Commit digest and cache back to repo
        if: success() || failure()
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digests/ .cache/
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new digest or cache changes."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "digest: ${DATE}"
            # Push to whichever branch we are on (supports both main and master)
            git push origin HEAD
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            DATE=$(date -u +%Y-%m-%d)
            MESSAGE="Digest workflow FAILED on ${DATE}. Check https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${MESSAGE}" \
              > /dev/null
          else
            echo "Telegram credentials not set — skipping failure notification."
          fi
